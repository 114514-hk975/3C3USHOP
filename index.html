<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部署成功 - SheepShop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #00BCD4;
        }
        p {
            color: #aaaaaa;
            line-height: 1.8;
            font-size: 1rem;
        }
        .highlight {
            color: #ffd700;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🚀</span>
        <h1>SheepShop 已成功上线！</h1>
        <p>
            如果你能看到这个页面，说明 <span class="highlight">GitHub Pages</span> 已经正确配置。<br>
            接下来，你可以把完整的商店代码粘贴进这个 <code>index.html</code>，重新上传覆盖即可。
        </p>
        <div class="footer">
            Powered by GitHub Pages · 3C3U SheepShop
        </div>
    </div>
</body>
</html>
